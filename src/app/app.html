<div class="page-shell">
  <div class="form-card">
    <div class="form-header">
      <span class="eyebrow">Profile</span>
      <h1>Form Group</h1>
    </div>

    <ul class="summary-list">
      <li>
        <span>Name</span>
        <strong>{{ loginForm.value.name || 'Not set' }}</strong>
      </li>
      <li>
        <span>Email</span>
        <strong>{{ loginForm.value.email || 'Not set' }}</strong>
      </li>
      <li>
        <span>Password</span>
        <strong>{{ loginForm.value.password || 'Not set' }}</strong>
      </li>
    </ul>

    <form [formGroup]="loginForm" (ngSubmit)="handleProfile()" novalidate>
      <div class="field-group">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" placeholder="Jane Doe" />
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="jane@example.com" />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter your password" />
      </div>

      <div class="actions">
        <button type="button" class="primary" (click)="submit()">Submit</button>
        <button type="button" class="secondary" (click)="reset()">Reset</button>
      </div>
    </form>
  </div>
</div>
